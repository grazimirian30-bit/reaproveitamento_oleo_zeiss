<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Óleo Consciente: descarte e reciclagem do óleo de cozinha usado, educação ambiental e recursos educativos."><meta name="theme-color" content="#153d32"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="css/style.css"><script defer src="js/script.js"></script><title>Dicas sustentáveis | Óleo Consciente</title><style>.dicas-poster-wide{width:min(96vw,1600px);max-width:none;margin:22px 0 35px;position:relative;left:50%;transform:translateX(-50%)}.dicas-image-wrap{position:relative}.dicas-image-wrap img{display:block;width:100%;height:auto;border-radius:18px;box-shadow:0 12px 30px #153d3222}.dicas-hotspot{position:absolute;display:block;z-index:1;border-radius:10px}.dicas-hotspot:hover{background:#fff38a30;outline:2px solid #197444}.dicas-hotspot:focus-visible{outline:4px solid #e8a900;background:#ffffff55}.dicas-visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}.dicas-details{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin:18px 0 30px}.dicas-detail{background:#f3f9f1;padding:20px;border:1px solid #cbdcc7;border-radius:16px;scroll-margin-top:20px}.dicas-detail h3{margin:0 0 7px;color:#174c3b}.dicas-detail p{margin:0;line-height:1.55}@media(max-width:650px){.dicas-poster-wide{width:100%;left:auto;transform:none}.dicas-image-wrap img{border-radius:9px}}</style><style>.dicas-saiba-mais{margin:18px 0 34px;padding:clamp(20px,3vw,32px);border-radius:18px;border:2px solid #c3dfc6;background:#f5fbf3;scroll-margin-top:20px}.dicas-saiba-mais h2{color:#174c3b;margin:0 0 12px}.dicas-saiba-mais p,.dicas-saiba-mais li{line-height:1.6}.dicas-saiba-mais ol{padding-left:24px}.dicas-saiba-mais .aviso{padding:12px 15px;border-left:4px solid #b15c14;background:#fff5dc;border-radius:8px}.dicas-hotspot[data-topic]{cursor:pointer}</style><style>.dicas-saiba-mais[hidden],.dicas-poster-wide[hidden]{display:none!important}.dicas-saiba-mais{max-width:850px;margin:28px auto;min-height:280px}.dicas-saiba-mais h3{font-size:clamp(1.4rem,3vw,2rem);margin:12px 0}.dicas-saiba-mais #dicas-voltar{margin-top:22px;cursor:pointer}main>.container{max-width:1700px}</style></head><body><a class="skip" href="#conteudo">Ir ao conteúdo</a><main id="conteudo"><div class="container"><figure class="dicas-poster-wide" id="dicas-imagem"><div class="dicas-image-wrap"><img src="Dicas%20Sustent%C3%A1veis%20para%20Reaproveitar%20%C3%93leo.png" alt="Infográfico Dicas e Reaproveitamento para a ZEISS, com cinco orientações sustentáveis e navegação interativa" loading="eager" width="1648" height="928"><a class="dicas-hotspot" href="index.html" aria-label="Início" title="Início" style="left:25.8%;top:0.7%;width:8.3%;height:12%"><span class="dicas-visually-hidden">Início</span></a><a class="dicas-hotspot" href="impactos.html" aria-label="Impactos ambientais" title="Impactos ambientais" style="left:34.1%;top:0.7%;width:9.1%;height:12%"><span class="dicas-visually-hidden">Impactos ambientais</span></a><a class="dicas-hotspot" href="armazenamento.html" aria-label="Armazenamento correto" title="Armazenamento correto" style="left:43.2%;top:0.7%;width:10.1%;height:12%"><span class="dicas-visually-hidden">Armazenamento correto</span></a><a class="dicas-hotspot" href="coleta.html" aria-label="Coleta e reciclagem" title="Coleta e reciclagem" style="left:53.3%;top:0.7%;width:9.1%;height:12%"><span class="dicas-visually-hidden">Coleta e reciclagem</span></a><a class="dicas-hotspot" href="educacao.html" aria-label="Educação ambiental" title="Educação ambiental" style="left:62.4%;top:0.7%;width:9.5%;height:12%"><span class="dicas-visually-hidden">Educação ambiental</span></a><a class="dicas-hotspot" href="dicas.html" aria-label="Dicas sustentáveis" title="Dicas sustentáveis" style="left:71.9%;top:0.7%;width:10%;height:12%"><span class="dicas-visually-hidden">Dicas sustentáveis</span></a><a class="dicas-hotspot" href="projeto.html" aria-label="Projeto na ZEISS" title="Projeto na ZEISS" style="left:81.9%;top:0.7%;width:15.1%;height:12%"><span class="dicas-visually-hidden">Projeto na ZEISS</span></a><a class="dicas-hotspot" href="#armazenar" aria-label="Armazene com segurança" title="Armazene com segurança" style="left:2%;top:42%;width:18%;height:39%"><span class="dicas-visually-hidden">Armazene com segurança</span></a><a class="dicas-hotspot" href="#entregar" aria-label="Entregue para reciclagem" title="Entregue para reciclagem" style="left:21%;top:42%;width:18%;height:39%"><span class="dicas-visually-hidden">Entregue para reciclagem</span></a><a class="dicas-hotspot" href="#transformar" aria-label="Transforme com responsabilidade" title="Transforme com responsabilidade" style="left:41%;top:42%;width:18%;height:39%"><span class="dicas-visually-hidden">Transforme com responsabilidade</span></a><a class="dicas-hotspot" href="#evitar" aria-label="Evite desperdício" title="Evite desperdício" style="left:61%;top:42%;width:18%;height:39%"><span class="dicas-visually-hidden">Evite desperdício</span></a><a class="dicas-hotspot" href="#compartilhar" aria-label="Compartilhe a ideia" title="Compartilhe a ideia" style="left:81%;top:42%;width:18%;height:39%"><span class="dicas-visually-hidden">Compartilhe a ideia</span></a><a class="dicas-hotspot" href="trilha.html" aria-label="Desafio ZEISS" title="Desafio ZEISS" style="left:76%;top:87%;width:22%;height:10%"><span class="dicas-visually-hidden">Desafio ZEISS</span></a></div></figure><section class="dicas-saiba-mais" id="saiba-mais" hidden aria-labelledby="saiba-mais-titulo"><h2 id="saiba-mais-titulo">Saiba mais</h2><p class="dicas-instruction" id="dicas-instruction">Clique em uma das cinco orientações para saber mais.</p><div id="dicas-result" aria-live="polite" aria-atomic="true"></div><button type="button" id="dicas-voltar" class="button">← Voltar à imagem</button></section></div></main><script>document.addEventListener("DOMContentLoaded",()=>{const conteudos={"armazenar":"<h3>Armazene com segurança</h3><p>Espere o óleo esfriar. Guarde em uma garrafa PET limpa, seca, resistente e bem fechada. Identifique o conteúdo.</p>","entregar":"<h3>Entregue para reciclagem</h3><p>Encontre um ponto que receba óleo de cozinha usado e confirme as orientações para entrega da garrafa.</p>","transformar":"<h3>Transforme com responsabilidade</h3><p>Organizações capacitadas podem transformar o óleo em sabão, biodiesel e outros produtos.</p><p class='aviso'>Não manipule soda cáustica sem capacitação e equipamentos apropriados.</p>","evitar":"<h3>Evite desperdício</h3><p>Planeje o uso do óleo, utilize apenas o necessário e nunca despeje o excedente na pia ou no solo.</p>","compartilhar":"<h3>Compartilhe a ideia</h3><p>Incentive familiares e colegas a armazenar e encaminhar o óleo usado para reciclagem.</p>"};const painel=document.getElementById("saiba-mais"),resultado=document.getElementById("dicas-result"),instrucao=document.getElementById("dicas-instruction"),imagem=document.getElementById("dicas-imagem"),voltar=document.getElementById("dicas-voltar");voltar.addEventListener("click",()=>{painel.hidden=true;imagem.hidden=false;resultado.innerHTML="";instrucao.hidden=false;imagem.scrollIntoView({behavior:"smooth",block:"start"})});document.querySelectorAll(".dicas-hotspot[href^='#']").forEach(link=>{const id=link.getAttribute("href").slice(1);if(!Object.prototype.hasOwnProperty.call(conteudos,id))return;link.addEventListener("click",event=>{event.preventDefault();resultado.innerHTML=conteudos[id];instrucao.hidden=true;imagem.hidden=true;painel.hidden=false;painel.scrollIntoView({behavior:"smooth",block:"start"})})})});</script></body></html>
