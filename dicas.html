<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Óleo Consciente: descarte e reciclagem do óleo de cozinha usado, educação ambiental e recursos educativos."><meta name="theme-color" content="#153d32"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="css/style.css"><script defer src="js/script.js"></script><title>Dicas sustentáveis | Óleo Consciente</title><style>.dicas-poster-wide{width:min(96vw,1600px);max-width:none;margin:22px 0 35px;position:relative;left:50%;transform:translateX(-50%)}.dicas-image-wrap{position:relative}.dicas-image-wrap img{display:block;width:100%;height:auto;border-radius:18px;box-shadow:0 12px 30px #153d3222}.dicas-hotspot{position:absolute;display:block;z-index:1;border-radius:10px}.dicas-hotspot:hover{background:#fff38a30;outline:2px solid #197444}.dicas-hotspot:focus-visible{outline:4px solid #e8a900;background:#ffffff55}.dicas-visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}.dicas-details{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin:18px 0 30px}.dicas-detail{background:#f3f9f1;padding:20px;border:1px solid #cbdcc7;border-radius:16px;scroll-margin-top:20px}.dicas-detail h3{margin:0 0 7px;color:#174c3b}.dicas-detail p{margin:0;line-height:1.55}@media(max-width:650px){.dicas-poster-wide{width:100%;left:auto;transform:none}.dicas-image-wrap img{border-radius:9px}}</style><style>.dicas-saiba-mais{margin:18px 0 34px;padding:clamp(20px,3vw,32px);border-radius:18px;border:2px solid #c3dfc6;background:#f5fbf3;scroll-margin-top:20px}.dicas-saiba-mais h2{color:#174c3b;margin:0 0 12px}.dicas-saiba-mais p,.dicas-saiba-mais li{line-height:1.6}.dicas-saiba-mais ol{padding-left:24px}.dicas-saiba-mais .aviso{padding:12px 15px;border-left:4px solid #b15c14;background:#fff5dc;border-radius:8px}.dicas-hotspot[data-topic]{cursor:pointer}</style><style>.dicas-saiba-mais[hidden],.dicas-poster-wide[hidden]{display:none!important}.dicas-saiba-mais{max-width:850px;margin:28px auto;min-height:280px}.dicas-saiba-mais h3{font-size:clamp(1.4rem,3vw,2rem);margin:12px 0}.dicas-saiba-mais #dicas-voltar{margin-top:22px;cursor:pointer}main>.container{max-width:1700px}</style></head><body><a class="skip" href="#conteudo">Ir ao conteúdo</a><main id="conteudo"><div class="container"><figure class="dicas-poster-wide" id="dicas-imagem"><div class="dicas-image-wrap"><img src="Dicas%20Sustent%C3%A1veis%20para%20Reaproveitar%20%C3%93leo.png" alt="Infográfico Dicas e Reaproveitamento para a ZEISS, com cinco orientações sustentáveis e navegação interativa" loading="eager" width="1648" height="928"><a class="dicas-hotspot" href="index.html" aria-label="Início" title="Início" style="left:25.8%;top:0.7%;width:8.3%;height:12%"><span class="dicas-visually-hidden">Início</span></a><a class="dicas-hotspot" href="impactos.html" aria-label="Impactos ambientais" title="Impactos ambientais" style="left:34.1%;top:0.7%;width:9.1%;height:12%"><span class="dicas-visually-hidden">Impactos ambientais</span></a><a class="dicas-hotspot" href="armazenamento.html" aria-label="Armazenamento correto" title="Armazenamento correto" style="left:43.2%;top:0.7%;width:10.1%;height:12%"><span class="dicas-visually-hidden">Armazenamento correto</span></a><a class="dicas-hotspot" href="coleta.html" aria-label="Coleta e reciclagem" title="Coleta e reciclagem" style="left:53.3%;top:0.7%;width:9.1%;height:12%"><span class="dicas-visually-hidden">Coleta e reciclagem</span></a><a class="dicas-hotspot" href="educacao.html" aria-label="Educação ambiental" title="Educação ambiental" style="left:62.4%;top:0.7%;width:9.5%;height:12%"><span class="dicas-visually-hidden">Educação ambiental</span></a><a class="dicas-hotspot" href="dicas.html" aria-label="Dicas sustentáveis" title="Dicas sustentáveis" style="left:71.9%;top:0.7%;width:10%;height:12%"><span class="dicas-visually-hidden">Dicas sustentáveis</span></a><a class="dicas-hotspot" href="projeto.html" aria-label="Projeto na escola" title="Projeto na escola" style="left:81.9%;top:0.7%;width:15.1%;height:12%"><span class="dicas-visually-hidden">Projeto na escola</span></a><a class="dicas-hotspot" href="#sabao-barra" aria-label="Sabão em barra" title="Sabão em barra" style="left:2.1%;top:73%;width:17.4%;height:5.5%"><span class="dicas-visually-hidden">Sabão em barra</span></a><a class="dicas-hotspot" href="#sabao-liquido" aria-label="Sabão líquido" title="Sabão líquido" style="left:22.1%;top:73%;width:16.4%;height:5.5%"><span class="dicas-visually-hidden">Sabão líquido</span></a><a class="dicas-hotspot" href="#biodiesel" aria-label="Biodiesel" title="Biodiesel" style="left:42.1%;top:73%;width:16.1%;height:5.5%"><span class="dicas-visually-hidden">Biodiesel</span></a><a class="dicas-hotspot" href="#limpeza" aria-label="Produtos de limpeza" title="Produtos de limpeza" style="left:62.2%;top:73%;width:16.2%;height:5.5%"><span class="dicas-visually-hidden">Produtos de limpeza</span></a><a class="dicas-hotspot" href="#outras-ideias" aria-label="Outras ideias" title="Outras ideias" style="left:81.7%;top:73%;width:16.3%;height:5.5%"><span class="dicas-visually-hidden">Outras ideias</span></a></div></figure><section class="dicas-saiba-mais" id="saiba-mais" hidden aria-labelledby="saiba-mais-titulo"><h2 id="saiba-mais-titulo">Saiba mais</h2><p class="dicas-instruction" id="dicas-instruction">Clique em uma das cinco opções da imagem para ver aqui a explicação e, quando houver, o modo de preparo.</p><div id="dicas-result" aria-live="polite" aria-atomic="true"></div><button type="button" id="dicas-voltar" class="button">← Voltar à imagem</button></section></div></main><script>document.addEventListener("DOMContentLoaded",()=>{const conteudos={"sabao-barra":"<h3>Sabão em barra</h3><p>O óleo de cozinha usado pode ser transformado em sabão em barra por pessoas capacitadas, por meio da saponificação.</p><p class=\"aviso\"><strong>Segurança:</strong> a fabricação a partir de óleo exige substâncias corrosivas, como soda cáustica. Não é uma atividade indicada para estudantes ou para execução sem supervisão técnica.</p><p><strong>Como aproveitar:</strong> entregue o óleo usado a uma iniciativa que produza sabão de forma segura e utilize o produto final conforme as orientações do fabricante.</p>","sabao-liquido":"<h3>Como fazer sabão líquido a partir de sabão reciclado pronto</h3><p>Uma alternativa mais segura é diluir <strong>sabão em barra já pronto</strong>, produzido por uma iniciativa de reciclagem de óleo. Não é necessário manipular soda cáustica.</p><p><strong>Materiais:</strong> aproximadamente 100 g de sabão em barra reciclado pronto, 1 litro de água morna, ralador, recipiente resistente, colher e frasco limpo com tampa.</p><ol><li>Com ajuda de um adulto, rale o sabão pronto.</li><li>Coloque as raspas em um recipiente e adicione a água morna aos poucos.</li><li>Misture até dissolver. Deixe esfriar e observe a consistência; ela pode variar conforme a composição do sabão.</li><li>Transfira para um frasco limpo, identifique como produto de limpeza e mantenha longe de crianças e animais.</li></ol><p class=\"aviso\"><strong>Atenção:</strong> esta é uma diluição de sabão reciclado <em>já fabricado</em>, não uma receita de saponificação de óleo cru. Não misture com água sanitária, ácidos ou outros produtos. Use somente para limpeza de superfícies adequadas, testando antes em uma pequena área.</p>","biodiesel":"<h3>Biodiesel</h3><p>O óleo de cozinha usado pode ser transformado em biodiesel em instalações especializadas, mediante processos químicos e controles de qualidade.</p><p><strong>Como participar:</strong> armazene o óleo frio em uma garrafa plástica bem fechada e entregue-o a um ponto de coleta que encaminhe esse resíduo para reciclagem.</p>","limpeza":"<h3>Produtos de limpeza</h3><p>O óleo recuperado pode servir de matéria-prima para sabões e determinados produtos de limpeza quando processado por profissionais.</p><p><strong>Dica prática:</strong> utilize sabão reciclado pronto, seguindo o rótulo. Não misture produtos de limpeza entre si.</p>","outras-ideias":"<h3>Outras ideias de reaproveitamento</h3><p>Dependendo do processo e da qualidade da matéria-prima, o óleo residual pode ter aplicações em produtos industriais e artesanais, como certos sabões e biocombustíveis.</p><p><strong>Na escola e em casa:</strong> organize uma campanha de coleta, crie cartazes informativos e pesquise iniciativas locais que recebam óleo de cozinha usado.</p>"};const painel=document.getElementById("saiba-mais");const resultado=document.getElementById("dicas-result");const instrucao=document.getElementById("dicas-instruction");const imagem=document.getElementById("dicas-imagem");const voltar=document.getElementById("dicas-voltar");voltar.addEventListener("click",()=>{painel.hidden=true;imagem.hidden=false;resultado.innerHTML="";instrucao.hidden=false;imagem.scrollIntoView({behavior:"smooth",block:"start"});});document.querySelectorAll(".dicas-hotspot[href^='#']").forEach(link=>{const id=link.getAttribute("href").slice(1);if(!Object.prototype.hasOwnProperty.call(conteudos,id))return;link.dataset.topic=id;link.addEventListener("click",event=>{event.preventDefault();resultado.innerHTML=conteudos[id];instrucao.hidden=true;imagem.hidden=true;painel.hidden=false;painel.scrollIntoView({behavior:"smooth",block:"start"});});});});</script></body></html>
